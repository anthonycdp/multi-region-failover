version: '3.8'

services:
  # Primary Region - US East (N. Virginia)
  us-east-service:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: us-east-service
    hostname: us-east-service
    environment:
      - REGION=us-east-1
      - PORT=8000
      - PRIMARY=true
      - DB_HOST=us-east-db
      - DB_PORT=5432
    ports:
      - "8001:8000"
    networks:
      - multi-region-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "region=us-east-1"
      - "role=primary"

  # Secondary Region - EU West (Ireland)
  eu-west-service:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: eu-west-service
    hostname: eu-west-service
    environment:
      - REGION=eu-west-1
      - PORT=8000
      - PRIMARY=false
      - DB_HOST=eu-west-db
      - DB_PORT=5432
    ports:
      - "8002:8000"
    networks:
      - multi-region-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "region=eu-west-1"
      - "role=secondary"

  # Secondary Region - AP Southeast (Singapore)
  ap-southeast-service:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ap-southeast-service
    hostname: ap-southeast-service
    environment:
      - REGION=ap-southeast-1
      - PORT=8000
      - PRIMARY=false
      - DB_HOST=ap-southeast-db
      - DB_PORT=5432
    ports:
      - "8003:8000"
    networks:
      - multi-region-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "region=ap-southeast-1"
      - "role=secondary"

  # Health Monitor Service
  health-monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    container_name: health-monitor
    hostname: health-monitor
    environment:
      - MONITOR_PORT=8080
      - CHECK_INTERVAL=5
      - FAILURE_THRESHOLD=3
      - RECOVERY_THRESHOLD=2
      - REGIONS=us-east-1=http://us-east-service:8000,eu-west-1=http://eu-west-service:8000,ap-southeast-1=http://ap-southeast-service:8000
    ports:
      - "8080:8080"
    networks:
      - multi-region-net
    depends_on:
      - us-east-service
      - eu-west-service
      - ap-southeast-service

  # Global Load Balancer
  load-balancer:
    build:
      context: ./loadbalancer
      dockerfile: Dockerfile
    container_name: load-balancer
    hostname: load-balancer
    environment:
      - LB_PORT=9000
      - HEALTH_CHECK_INTERVAL=5
      - FAILURE_THRESHOLD=3
      - RECOVERY_THRESHOLD=2
      - REQUEST_TIMEOUT=10
      - REGIONS=us-east-1=http://us-east-service:8000:1:100:true,eu-west-1=http://eu-west-service:8000:2:80:false,ap-southeast-1=http://ap-southeast-service:8000:3:60:false
    ports:
      - "9000:9000"
    networks:
      - multi-region-net
    depends_on:
      - us-east-service
      - eu-west-service
      - ap-southeast-service

  # Dashboard UI (Optional - lightweight monitoring dashboard)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    hostname: dashboard
    environment:
      - LB_URL=http://load-balancer:9000
      - MONITOR_URL=http://health-monitor:8080
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - multi-region-net
    depends_on:
      - load-balancer
      - health-monitor

  # ========================================
  # Monitoring: Prometheus
  # ========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - multi-region-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # Monitoring: Grafana
  # ========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    networks:
      - multi-region-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ========================================
  # Optional: HAProxy Load Balancer
  # ========================================
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    ports:
      - "8080:80"
      - "8404:8404"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - multi-region-net
    depends_on:
      - us-east-service
      - eu-west-service
      - ap-southeast-service
    profiles:
      - haproxy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  multi-region-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  prometheus_data:
  grafana_data:
