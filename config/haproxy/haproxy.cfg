# HAProxy Configuration for Multi-Region Failover
# This configuration provides load balancing with health checks and automatic failover

global
    log stdout format raw local0
    maxconn 4096
    daemon off
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3
    timeout connect    5s
    timeout client     50s
    timeout server     50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout check      2s
    balance roundrobin

# Stats page
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if LOCALHOST
    stats show-legends
    stats show-node

# Main frontend
frontend http_front
    bind *:80

    # ACL for health check endpoint
    acl is_lb_status path /lb/status
    acl is_lb_health path /lb/health
    acl is_lb_metrics path /lb/metrics

    # Health check responses
    http-request set-path /health if is_lb_health

    # Use backend based on path
    use_backend lb_status if is_lb_status
    default_backend regions_backend

# Status backend (returns HAProxy stats as JSON)
backend lb_status
    mode http
    option httpchk GET /stats
    server stats 127.0.0.1:8404 stats

# Regions backend with health checks
backend regions_backend
    mode http
    option httpchk GET /health
    http-check expect status 200

    # Health check configuration
    # Check every 5 seconds, fall after 3 failures, rise after 2 successes
    default-server inter 5s fall 3 rise 2

    # US-East (Primary) - Highest priority
    server region_us_east us-east-service:8000 check weight 100

    # EU-West (Secondary) - Medium priority
    server region_eu_west eu-west-service:8000 check weight 80 backup

    # AP-Southeast (Secondary) - Lower priority
    server region_ap_southeast ap-southeast-service:8000 check weight 60 backup

# TCP backend for raw connections (alternative)
frontend tcp_front
    bind *:443
    mode tcp
    default_backend regions_tcp

backend regions_tcp
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect port 8000

    # US-East (Primary)
    server region_us_east us-east-service:8000 check inter 5s fall 3 rise 2

    # EU-West (Secondary)
    server region_eu_west eu-west-service:8000 check inter 5s fall 3 rise 2 backup

    # AP-Southeast (Secondary)
    server region_ap_southeast ap-southeast-service:8000 check inter 5s fall 3 rise 2 backup

# Error pages
errorfile 400 /usr/local/etc/haproxy/errors/400.http
errorfile 403 /usr/local/etc/haproxy/errors/403.http
errorfile 408 /usr/local/etc/haproxy/errors/408.http
errorfile 500 /usr/local/etc/haproxy/errors/500.http
errorfile 502 /usr/local/etc/haproxy/errors/502.http
errorfile 503 /usr/local/etc/haproxy/errors/503.http
errorfile 504 /usr/local/etc/haproxy/errors/504.http
